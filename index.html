<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好友默契测试 · 完整版</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff7fb,#17121b);--card:light-dark(#ffffff,#241b29);--ink:light-dark(#33263b,#fff4fb);--muted:light-dark(#796b80,#c7b8cd);--line:light-dark(#eadce8,#49384f);--pink:light-dark(#e94f9b,#ff82bf);--pink2:light-dark(#fff0f7,#422338);--purple:light-dark(#7c5ce0,#b5a0ff)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}#app{min-height:100vh;background:var(--bg);padding:26px 16px 44px}.wrap{max-width:760px;margin:auto}.hero{text-align:center;padding:25px 12px 20px}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--pink);background:var(--card)}h1{font-size:clamp(30px,7vw,48px);margin:15px 0 8px;letter-spacing:1px}.hero p{color:var(--muted);margin:0;line-height:1.7}.progress-wrap{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:16px 0 22px}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width .25s}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 10px 30px #00000008}.label{display:block;font-weight:700;margin-bottom:9px}.name-input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}.qhead{display:flex;gap:12px;align-items:flex-start}.num{flex:0 0 34px;height:34px;display:grid;place-items:center;border-radius:11px;background:var(--pink2);color:var(--pink);font-weight:800}.qtitle{font-size:17px;font-weight:750;padding-top:5px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.option{display:flex;align-items:center;gap:9px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:13px;background:transparent;color:var(--ink);font:inherit;cursor:pointer;min-height:48px;transition:.15s}.option:hover{border-color:var(--pink)}.option.selected{border-color:var(--pink);background:var(--pink2);box-shadow:inset 0 0 0 1px var(--pink)}.letter{display:grid;place-items:center;width:27px;height:27px;flex-shrink:0;border-radius:8px;background:var(--line);font-size:12px;font-weight:800}.option.selected .letter{background:var(--pink);color:white}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:13px;padding:13px 19px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--pink);color:white;flex:1}.secondary{background:var(--pink2);color:var(--pink)}.hint{color:var(--muted);font-size:13px;line-height:1.6}.result{text-align:center;padding:30px 22px}.score{font-size:64px;font-weight:900;letter-spacing:-2px;color:var(--pink);margin:8px 0}.result h2{font-size:27px;margin:8px 0}.result p{line-height:1.8;color:var(--muted)}.hidden{display:none}.result-emoji{font-size:45px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}.extra-actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 22px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.panel h2{margin:0 0 10px;font-size:21px}.leader-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.leader-row:last-child{border-bottom:0}.rank{color:var(--pink);font-weight:800;min-width:30px}.tiny{font-size:12px;color:var(--muted)}.pop{animation:pop .45s ease both}@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.sparkle{position:fixed;pointer-events:none;z-index:10;font-size:20px;animation:floatUp 1.2s ease-out forwards}@keyframes floatUp{to{transform:translateY(-90px) rotate(25deg);opacity:0}}@media(max-width:520px){.options{grid-template-columns:1fr}.card{padding:17px}.hero{padding-top:12px}}
</style>
</head>
<body><main id="app"><div class="wrap">
<header class="hero"><span class="badge">💗 FRIENDSHIP QUIZ · 好友挑战</span><h1>谁才是最懂我的人？</h1><p>回答 10 道关于我的问题，看看我们的默契有多少！<br>准备好了吗？开始挑战吧 ✨</p></header>
<section id="quiz"><div class="card"><label class="label" for="friendName">👋 你的名字 / 昵称</label><input class="name-input" id="friendName" maxlength="30" placeholder="输入你的名字"></div><div class="progress-wrap"><div class="progress" id="progress"></div></div><div id="questions"></div><p class="hint">小提示：这是一份示范题目。你可以把题目和选项改成真正关于你的内容，再分享给朋友玩。</p><div class="actions"><button class="btn primary" id="submit">提交答案，查看结果 ✨</button><button class="btn secondary" id="reset">重来一次</button></div><div class="extra-actions"><button class="btn secondary" id="invite">📤 分享测试链接</button><button class="btn secondary" id="showBoard">🏆 好友排行榜</button><button class="btn secondary" id="exportData">📥 导出本机记录</button></div><section id="board" class="panel hidden"><h2>🏆 好友排行榜</h2><p class="hint">这里显示在这台设备上完成的测试记录。不同朋友的手机记录不会自动同步。</p><div id="boardRows"></div><div class="actions"><button class="btn secondary" id="clearBoard">清空本机记录</button></div></section></section>
<section id="result" class="card result hidden" aria-live="polite"><div class="result-emoji" id="resultEmoji">💗</div><p id="resultName"></p><h2 id="resultTitle">好友默契结果</h2><div class="score"><span id="score">0</span><span style="font-size:24px"> / 100</span></div><p id="resultText"></p><div class="actions"><button class="btn primary" id="again">再测一次</button><button class="btn secondary" id="share">分享结果</button></div><p class="hint">测试记录会保存在当前设备的浏览器中。若要让你在不同设备收到所有朋友的答案，需要把网站部署到网上并连接表单/数据库。</p></section>
<footer class="footer">Made with 💗 · 好友默契测试</footer></div></main>
<script>
const questions=[
 {q:'我最喜欢哪种颜色？',opts:['黑色 🖤','蓝色 💙','粉色 🩷','绿色 💚'],a:1},
 {q:'我空闲时最可能做什么？',opts:['玩游戏 🎮','看电影 🎬','睡觉 😴','找朋友聊天 💬'],a:0},
 {q:'我不开心时，比较可能会？',opts:['找人聊天','自己静一静','假装没事','先去吃东西'],a:0},
 {q:'下面哪一种是我最想吃的？',opts:['炸鸡 🍗','汉堡 🍔','火锅 🍲','披萨 🍕'],a:2},
 {q:'我最看重朋友的什么？',opts:['有趣幽默','真诚可靠','很会送礼','很受欢迎'],a:1},
 {q:'我最常用哪种方式聊天？',opts:['发信息 💬','发语音 🎙️','打电话 📞','当面聊 😊'],a:0},
 {q:'如果我有空，我更想？',opts:['出去玩','待在家','去购物','随便都可以'],a:0},
 {q:'我比较喜欢哪种礼物？',opts:['实用小物','手写卡片','零食大礼包','惊喜体验'],a:1},
 {q:'朋友做什么最容易让我开心？',opts:['记得我说过的话','请我吃东西','讲笑话','陪我一起玩'],a:0},
 {q:'你觉得我们最适合一起做什么？',opts:['一起打游戏','一起吃喝玩乐','一起读书学习','全部都可以！'],a:3}
];
const letters=['A','B','C','D'];let answers=Array(questions.length).fill(null);const STORAGE_KEY='friendshipQuizRecordsV1';
const questionsEl=document.getElementById('questions');
function render(){questionsEl.innerHTML='';questions.forEach((item,i)=>{const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='qhead';head.innerHTML=`<span class="num">${i+1}</span><div class="qtitle"></div>`;head.querySelector('.qtitle').textContent=item.q;card.appendChild(head);const opts=document.createElement('div');opts.className='options';item.opts.forEach((opt,j)=>{const b=document.createElement('button');b.type='button';b.className='option'+(answers[i]===j?' selected':'');b.setAttribute('aria-pressed',answers[i]===j?'true':'false');const letter=document.createElement('span');letter.className='letter';letter.textContent=letters[j];const txt=document.createElement('span');txt.textContent=opt;b.append(letter,txt);b.addEventListener('click',()=>{answers[i]=j;render();});opts.appendChild(b)});card.appendChild(opts);questionsEl.appendChild(card)});document.getElementById('progress').style.width=(answers.filter(x=>x!==null).length/questions.length*100)+'%'}
function submit(){const name=document.getElementById('friendName').value.trim();const missing=answers.findIndex(x=>x===null);if(!name){document.getElementById('friendName').focus();alert('先输入你的名字或昵称哦！');return}if(missing!==-1){alert(`还有第 ${missing+1} 题没回答，继续加油！`);document.querySelectorAll('#questions .card')[missing].scrollIntoView({behavior:'smooth',block:'center'});return}const score=Math.round(answers.reduce((sum,a,i)=>sum+(a===questions[i].a?10:0),0));let emoji,title,msg;if(score>=90){emoji='👑';title='灵魂好友！';msg='哇！你真的很了解我，默契值拉满！继续保持这份友情吧！'}else if(score>=70){emoji='💎';title='超级好朋友！';msg='你很懂我耶！再多相处一点，说不定就成为满分搭档！'}else if(score>=50){emoji='💗';title='默契正在升级！';msg='我们还有很多可以互相了解的地方，下次再来挑战！'}else if(score>=30){emoji='😆';title='友情新手村！';msg='哈哈，看来还有不少关于我的事情等你发现！'}else{emoji='🤣';title='你真的认识我吗？';msg='这次只是热身啦！多聊天、多相处，下次一定会更了解彼此！'}saveRecord({name,score,title,date:new Date().toISOString(),answers:[...answers]});celebrate();document.getElementById('result').classList.add('pop');document.getElementById('resultEmoji').textContent=emoji;document.getElementById('resultName').textContent=name+' 的测试结果';document.getElementById('resultTitle').textContent=title;document.getElementById('score').textContent=score;document.getElementById('resultText').textContent=msg;document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function reset(){document.getElementById('result').classList.remove('pop');answers=Array(questions.length).fill(null);document.getElementById('friendName').value='';document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})}

function getRecords(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return []}}
function saveRecord(record){const records=getRecords();records.push(record);localStorage.setItem(STORAGE_KEY,JSON.stringify(records));renderBoard()}
function renderBoard(){const box=document.getElementById('boardRows');if(!box)return;const records=getRecords().sort((a,b)=>b.score-a.score||new Date(b.date)-new Date(a.date));box.innerHTML='';if(!records.length){box.innerHTML='<p class="hint">还没有记录。完成一次测试后，排行榜就会出现结果！</p>';return}records.slice(0,20).forEach((r,i)=>{const row=document.createElement('div');row.className='leader-row';const left=document.createElement('div');left.innerHTML=`<span class="rank">#${i+1}</span> `;const name=document.createElement('strong');name.textContent=r.name;left.appendChild(name);const right=document.createElement('div');right.style.textAlign='right';const score=document.createElement('strong');score.textContent=r.score+' 分';const title=document.createElement('div');title.className='tiny';title.textContent=r.title;right.append(score,title);row.append(left,right);box.appendChild(row)})}
function celebrate(){const symbols=['💗','✨','🎉','💖','⭐'];for(let i=0;i<18;i++){const el=document.createElement('span');el.className='sparkle';el.textContent=symbols[Math.floor(Math.random()*symbols.length)];el.style.left=(5+Math.random()*90)+'vw';el.style.top=(45+Math.random()*35)+'vh';el.style.animationDelay=(Math.random()*.35)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),1700)}}
async function shareInvite(){const url=location.href;const text='💗 来挑战我的好友默契测试！答完看看你有多了解我！';try{if(navigator.share){await navigator.share({title:'好友默契测试',text,url})}else if(navigator.clipboard&&url.startsWith('http')){await navigator.clipboard.writeText(text+' '+url);alert('测试链接已复制，可以发给朋友！')}else{prompt('如果网站已发布到网上，请复制这个网页地址分享给朋友：',url)}}catch(e){}}
document.getElementById('invite').addEventListener('click',shareInvite);
document.getElementById('showBoard').addEventListener('click',()=>{const board=document.getElementById('board');board.classList.toggle('hidden');renderBoard();if(!board.classList.contains('hidden'))board.scrollIntoView({behavior:'smooth',block:'start'})});
document.getElementById('exportData').addEventListener('click',()=>{const records=getRecords();if(!records.length){alert('目前还没有本机测试记录。');return}const rows=[['名字','分数','好友等级','时间','每题答案'],...records.map(r=>[r.name,r.score,r.title,new Date(r.date).toLocaleString(),r.answers.map((a,i)=>`${i+1}:${letters[a]}`).join(' ')])];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='好友测试记录.csv';a.click();URL.revokeObjectURL(a.href)});
document.getElementById('clearBoard').addEventListener('click',()=>{if(confirm('确定清空这台设备上的所有好友测试记录吗？')){localStorage.removeItem(STORAGE_KEY);renderBoard()}});
renderBoard();

document.getElementById('submit').addEventListener('click',submit);document.getElementById('reset').addEventListener('click',reset);document.getElementById('again').addEventListener('click',reset);document.getElementById('share').addEventListener('click',async()=>{const text=`我的好友默契测试得分：${document.getElementById('score').textContent}/100！快来挑战看看！`;try{if(navigator.share)await navigator.share({title:'好友默契测试',text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('结果文字已复制！你可以贴给朋友。')}else alert(text)}catch(e){}});render();
</script></body></html>
